# Sample workloads for the hardening demo:
#
#   hardening-a/bare            nothing set; no evidence that it can run as non-root
#   hardening-a/root-nginx      needs root and port 80; runAsNonRoot or drop ALL would break it
#   hardening-a/non-root        runAsUser is set, so higher-risk fields are safe; has an init container
#   hardening-a/partial         some values already set; they must never be overridden
#   hardening-a/hardened        already compliant; must produce no change
#   hardening-a/opted-out       carries the opt-out label; must be skipped
#   hardening-a/guaranteed      limits only, so requests default to them (Guaranteed QoS); no request may be added
#   hardening-a/privileged      privileged container; its securityContext must be left alone
#   hardening-a/sys-admin       adds CAP_SYS_ADMIN, which allowPrivilegeEscalation: false cannot be combined with
#   hardening-a/standalone      bare Pod; out of scope
#   hardening-b/redis           StatefulSet; its entrypoint starts as root and changes user
#   hardening-b/node-agent      DaemonSet; nothing set
#
# Workloads with a server have a readiness probe, so a completed rollout means
# the new pods actually serve, not just that their containers started.
---
apiVersion: v1
kind: Namespace
metadata: { name: hardening-a }
---
apiVersion: v1
kind: Namespace
metadata: { name: hardening-b }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bare, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: bare } }
  template:
    metadata: { labels: { app: bare } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: root-nginx, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: root-nginx } }
  template:
    metadata: { labels: { app: root-nginx } }
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          readinessProbe: { tcpSocket: { port: 80 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: non-root, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: non-root } }
  template:
    metadata: { labels: { app: non-root } }
    spec:
      securityContext:
        runAsUser: 1000
      initContainers:
        - name: init
          image: busybox:1.36
          command: ["sh", "-c", "true"]
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: partial, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: partial } }
  template:
    metadata: { labels: { app: partial } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
          resources:
            requests: { memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add: [NET_BIND_SERVICE]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hardened, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: hardened } }
  template:
    metadata: { labels: { app: hardened } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opted-out
  namespace: hardening-a
  labels: { sre.tyk.io/opt-out: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: opted-out } }
  template:
    metadata: { labels: { app: opted-out } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: guaranteed, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: guaranteed } }
  template:
    metadata: { labels: { app: guaranteed } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
          resources:
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: privileged, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: privileged } }
  template:
    metadata: { labels: { app: privileged } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
          securityContext:
            privileged: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sys-admin, namespace: hardening-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: sys-admin } }
  template:
    metadata: { labels: { app: sys-admin } }
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 2 }
          securityContext:
            capabilities:
              add: [CAP_SYS_ADMIN]
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone
  namespace: hardening-a
  labels: { app: standalone }
spec:
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: hardening-b }
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: hardening-b }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: app
          image: redis:7.4
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-agent, namespace: hardening-b }
spec:
  selector: { matchLabels: { app: node-agent } }
  template:
    metadata: { labels: { app: node-agent } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
