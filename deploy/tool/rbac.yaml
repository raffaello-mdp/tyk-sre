apiVersion: v1
kind: ServiceAccount
metadata:
  name: tyk-sre
  namespace: tyk-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tyk-sre
rules:
  - apiGroups: ["sre.tyk.io"]
    resources: ["isolations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sre.tyk.io"]
    resources: ["isolations/status"]
    verbs: ["get", "patch", "update"]
  # Lets the policy set blockOwnerDeletion on its owner reference.
  - apiGroups: ["sre.tyk.io"]
    resources: ["isolations/finalizers"]
    verbs: ["update"]
  # No delete: the garbage collector removes the policy of a deleted Isolation.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Hardening reads workloads directly and changes them with Server-Side Apply.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tyk-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tyk-sre
subjects:
  - kind: ServiceAccount
    name: tyk-sre
    namespace: tyk-sre
