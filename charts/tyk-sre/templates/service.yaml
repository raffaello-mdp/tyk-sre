apiVersion: v1
kind: Service
metadata:
  name: {{ include "tyk-sre.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tyk-sre.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tyk-sre.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
